[project]
name = "uc-intg-nzbinfo"
dynamic = ["version"]
description = "NZB Info Manager Integration for Unfolded Circle Remote Two/3"
authors = [
    {name = "Meir Miyara", email = "meir.miyara@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}

dependencies = [
    "ucapi-framework>=1.9.2",
    "ucapi>=0.6.0",
    "aiohttp>=3.9.0",
    "certifi",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["uc_intg_nzbinfo"]

[tool.setuptools.dynamic]
version = {attr = "uc_intg_nzbinfo.__version__"}

[project.urls]
"Homepage" = "https://github.com/mase1981/uc-intg-nzbinfo"
"Bug Reports" = "https://github.com/mase1981/uc-intg-nzbinfo/issues"
